[project]
name = "gnssdl"
version = "0.1.0"
description = "Fetch and analyse Nevada Geodetic Laboratory daily GNSS time series, toward a self-supervised network-reconstruction benchmark"
readme = "README.md"
authors = [
    { name = "Oguzb", email = "hoguzbolat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cutde>=26.3.6",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyproj>=3.8.0",
]

[project.optional-dependencies]
# the learned filters (m3k, m5, m6 and their variants); everything else runs without it
learned = [
    "torch>=2.14.1",
]

[project.scripts]
gnssdl = "gnssdl:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "torch>=2.14.1",      # the tests train small learned filters
]
