[project]
name = "gnssdl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oguzb", email = "hoguzbolat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.scripts]
gnssdl = "gnssdl:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
